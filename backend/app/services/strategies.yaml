# Recovery strategy table.
#
# This is the product. Everything else is plumbing around it.
#
# `raw_codes` VERIFIED against https://docs.getpinch.com.au/docs/dishonour-codes
# on 2026-07-25. Pinch emits exactly seven codes, all hyphenated lowercase:
#   insufficient-funds, temporary-problem, technical-error, blocked-by-bank,
#   invalid-account, invalid-card, unsupported-card
# Two of our classes (authority_cancelled, payment_stopped) have NO Pinch code
# and are simulator-only — marked inline below.

classes:

  insufficient_funds:
    raw_codes: ["insufficient-funds"]
    diagnosis: "Timing problem, not intent. The customer still wants the service."
    max_attempts: 4
    notify_human: false
    actions:
      - action: retry
        delay_hours: 120
        align_to_payday: true
      - action: request_details_update
        channel: email
        delay_hours: 0
        tone: soft
      # Anchored to the last scheduled retry by the engine, not to this figure:
      # the offer only makes sense once the earlier attempts have actually
      # failed. delay_hours is the floor, not the date.
      - action: offer_split
        channel: email
        delay_hours: 240
        tone: soft
    reasoning: >
      Funds were unavailable at the time of debit. Retrying on the customer's
      observed payday materially improves success rate versus a fixed interval.
      Messaging stays soft — this customer is not churning. If two payday-timed
      attempts both come back short, the amount is the problem rather than the
      timing, and the customer is offered the balance in instalments before
      anyone gives up on it.

  invalid_account:
    raw_codes: ["invalid-account"]
    diagnosis: "Data problem. Retrying is guaranteed to fail and incurs a fee."
    max_attempts: 0
    notify_human: false
    actions:
      - action: request_details_update
        channel: email
        delay_hours: 0
        tone: urgent
      - action: request_details_update
        channel: sms
        delay_hours: 48
      - action: notify_human
        delay_hours: 96
    reasoning: >
      The receiving account does not exist or is closed. No number of retries
      will change that, and each one costs the merchant a dishonour fee. Straight
      to details capture, escalating channel over four days.

  authority_cancelled:
    # SIMULATOR-ONLY: Pinch has no dishonour code for a cancelled mandate.
    # Emitted by our simulator so the strategy is demoable; a live dishonour
    # will never carry it. Revisit if Pinch adds a mandate event.
    raw_codes: ["authority-cancelled"]
    diagnosis: "Churn signal. The customer revoked permission deliberately."
    max_attempts: 0
    notify_human: true
    actions:
      - action: save_offer
        channel: email
        delay_hours: 0
      - action: notify_human
        delay_hours: 24
    reasoning: >
      The customer cancelled the debit authority at their bank. This is an
      intentional act and a retry would be both futile and hostile. Route to a
      save offer — pause, downgrade, or exit survey — and alert the account owner.

  payment_stopped:
    # SIMULATOR-ONLY: Pinch has no dishonour code for a stopped payment.
    # See the note on authority_cancelled above.
    raw_codes: ["payment-stopped"]
    diagnosis: "Dispute signal. Retrying escalates to a formal complaint."
    max_attempts: 0
    notify_human: true
    actions:
      - action: notify_human
        delay_hours: 0
    reasoning: >
      The customer specifically stopped this payment. Any automated response
      risks a chargeback or complaint. Humans only.

  technical:
    raw_codes: ["technical-error", "temporary-problem"]
    diagnosis: "Bank-side failure. Not the customer's fault and not their problem."
    max_attempts: 2
    notify_human: false
    actions:
      - action: retry
        delay_hours: 24
        align_to_payday: false
        silent: true
    reasoning: >
      A processing error on the bank's side. The customer is unaware anything
      happened and telling them manufactures churn out of an outage. Silent retry.

  expired_card:
    # Card codes, not direct debit. Kept for card-funded subscriptions.
    raw_codes: ["invalid-card", "unsupported-card"]
    diagnosis: "Predictable and preventable."
    max_attempts: 1
    notify_human: false
    actions:
      - action: retry
        delay_hours: 1
        align_to_payday: false
      - action: request_details_update
        channel: email
        delay_hours: 24
        tone: soft
    reasoning: >
      Card expiry is knowable in advance. Recovery here is a fallback — the real
      fix is the preventive job that warns 14 days before expiry.

  do_not_honour:
    # Pinch marks blocked-by-bank NON-retryable. The single retry below
    # contradicts that — see OPEN QUESTION 1 in docs/pinch-codes-proposal.md.
    raw_codes: ["blocked-by-bank"]
    diagnosis: "Ambiguous. Issuer risk rules, limits, or something unstated."
    max_attempts: 1
    notify_human: false
    actions:
      - action: retry
        delay_hours: 48
        align_to_payday: false
      - action: request_details_update
        channel: email
        delay_hours: 72
        tone: neutral
    reasoning: >
      The issuer declined without stating why. One retry is worth attempting;
      repeated attempts risk the merchant being flagged. Cap and move to details.

  unknown:
    raw_codes: []
    diagnosis: "Unrecognised code. Treated conservatively."
    max_attempts: 1
    notify_human: true
    actions:
      - action: retry
        delay_hours: 72
        align_to_payday: false
      - action: notify_human
        delay_hours: 0
    reasoning: >
      We do not recognise this dishonour code. One cautious retry, and a human
      is told so the mapping table can be extended.

# Cross-cutting rules that the engine enforces regardless of class.
global_rules:
  # Retry budget is per customer, not per invoice. Three failures across two
  # invoices is one relationship problem.
  customer_retry_budget_days: 30
  customer_max_retries_in_window: 5

  # Never contact a customer more than this often, across all channels.
  min_hours_between_customer_messages: 24

  # Retries align to these weekdays when align_to_payday is set and we have no
  # per-customer history. 3 = Thursday, 4 = Friday (Mon=0). Every retry is then
  # rolled off weekends and AU public holidays to the next business day — a
  # BECS file is not processed on Anzac Day, so scheduling one there would mean
  # the date we show and the date it happens are different things.
  default_payday_weekdays: [3, 4]

  # After this long with no recovery, write off and stop.
  write_off_after_days: 21

  # --- monthly payers ---
  # A debit this size reads as a monthly bill rather than a weekly service, so
  # after two payday attempts the ladder steps to their next equivalent date
  # instead of a third attempt on a rhythm that has already failed twice. This
  # is a heuristic on the amount, not a learned per-customer model — see
  # `looks_monthly` in strategy_engine.py and the roadmap note in the README.
  monthly_payer_min_cents: 15000
  monthly_escalation_attempt: 3
  # Only applied when that monthly attempt is actually scheduled: writing off
  # at 21 days would close the file days before the one date likely to work.
  monthly_payer_write_off_days: 35
